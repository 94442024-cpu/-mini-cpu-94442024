# Tiny Tapeout project information
project:
  title: "Mini 8-bit Accumulator CPU"        # Project title
  author: "Rodgers Odiwuor"                         # Your name
  discord: ""                                  # Your discord username (optional)
  description: "A tiny Von Neumann 8-bit accumulator CPU: 16-word shared code/data memory, 16-instruction ISA (load/store, add/sub, bitwise logic, jump/jump-if-zero/jump-if-carry, output, halt)."
  language: "Verilog"                          # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 10_000_000                         # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"                                 # Start here; bump up (2x2, etc.) if the hardening step fails on density/placement

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_94442024_mini_cpu"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "tt_um_mini_cpu.v"

  # The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
  pinout:
    # Inputs (currently unused, free for you to extend)
    ui[0]: ""
    ui[1]: ""
    ui[2]: ""
    ui[3]: ""
    ui[4]: ""
    ui[5]: ""
    ui[6]: ""
    ui[7]: ""
    # Outputs -- value last written by an OUT instruction
    uo[0]: "acc bit 0 (OUT register)"
    uo[1]: "acc bit 1 (OUT register)"
    uo[2]: "acc bit 2 (OUT register)"
    uo[3]: "acc bit 3 (OUT register)"
    uo[4]: "acc bit 4 (OUT register)"
    uo[5]: "acc bit 5 (OUT register)"
    uo[6]: "acc bit 6 (OUT register)"
    uo[7]: "acc bit 7 (OUT register)"
    # Bidirectional pins -- debug bus (all driven as outputs)
    uio[0]: "debug: program counter bit 0"
    uio[1]: "debug: program counter bit 1"
    uio[2]: "debug: program counter bit 2"
    uio[3]: "debug: program counter bit 3"
    uio[4]: "debug: FSM state (0=fetch, 1=exec)"
    uio[5]: "debug: zero flag"
    uio[6]: "debug: carry flag"
    uio[7]: "debug: halted flag"

# Do not change!
yaml_version: 6
